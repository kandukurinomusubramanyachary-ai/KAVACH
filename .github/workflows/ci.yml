name: KAVACH verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  KAVACH_DATA_DIR: /tmp/kavach-ci-disposable-runtime

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      # Pytest includes real editor/CSV subprocess regressions: no dependency skips.
      - run: npm ci
      - run: python -m pytest -q -ra --junitxml=reports/final/pytest.xml
      - name: Summarize actual Python results
        if: always()
        run: |
          python - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          report = pathlib.Path('reports/final/pytest.xml')
          if not report.exists():
              raise SystemExit('No pytest report; tests did not complete.')
          suite = ET.parse(report).getroot().find('testsuite')
          total, failed, errors, skipped = (int(suite.get(k, '0')) for k in ('tests', 'failures', 'errors', 'skipped'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'Python: {total-failed-errors-skipped} passed, {failed} failed, {errors} errors, {skipped} skipped; duration {suite.get("time")}s. Skips are not passes.\n')
          if skipped:
              raise SystemExit('Required Linux gates must not skip.')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: python-results
          path: reports/final/pytest.xml
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:editor
      - run: npm run test:csv
      - run: npm run build

  security-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m scripts.run_scenarios
      - run: python tests/acceptance_scenario.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
      - run: npm run build
      - run: python tests/browser_smoke.py
      - run: python tests/browser_hardening.py
      - run: python tests/browser_design.py
      - run: python tests/visual_design.py
      - run: python tests/browser_ux.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-evidence
          path: |
            reports/design/*.png
            reports/design/verification.json
            reports/*results.json
            reports/sprint/browser-hardening.json
            reports/final/ux*.json
            reports/final/ux*.png
          retention-days: 7

  secure-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: python scripts/release.py --output "$RUNNER_TEMP/KAVACH-final-release.zip"
      - run: python scripts/release.py --verify "$RUNNER_TEMP/KAVACH-final-release.zip"
      - run: python scripts/verify_release.py "$RUNNER_TEMP/KAVACH-final-release.zip" --browser --report reports/final/clean-extraction.json
      - uses: actions/upload-artifact@v6
        with:
          name: verified-source-release
          path: |
            ${{ runner.temp }}/KAVACH-final-release.zip
            reports/final/clean-extraction.json
          retention-days: 7
